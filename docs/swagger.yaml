info:
  contact: {}
  title: Test API
  version: "1.0"
paths:
  /attribute-values:
    get:
      description: Возвращает список всех значений атрибутов с пагинацией
      parameters:
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 20
        description: Лимит на страницу
        in: query
        name: limit
        type: integer
      - description: Фильтр по товару
        in: query
        name: product_id
        type: integer
      - description: Фильтр по атрибуту
        in: query
        name: attribute_id
        type: integer
      - description: Поиск по значению
        in: query
        name: search
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AttributeValueListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить список значений атрибутов
      tags:
      - AttributeValue
    post:
      consumes:
      - application/json
      description: Создает новое значение атрибута
      parameters:
      - description: Данные для создания значения атрибута
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/response.AttributeValueCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.AttributeValueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Создать значение атрибута
      tags:
      - AttributeValue
  /attribute-values/{id}:
    delete:
      description: Удаляет значение атрибута из БД по ID
      parameters:
      - description: AttributeValue ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Значение атрибута успешно удалено
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Удалить значение атрибута
      tags:
      - AttributeValue
    get:
      description: Возвращает значение атрибута по ID
      parameters:
      - description: AttributeValue ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AttributeValueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить значение атрибута по ID
      tags:
      - AttributeValue
    patch:
      consumes:
      - application/json
      description: Обновляет указанные поля значения атрибута по ID (PATCH)
      parameters:
      - description: AttributeValue ID
        in: path
        name: id
        required: true
        type: integer
      - description: Обновляемые поля значения атрибута
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/response.AttributeValuePatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AttributeValueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Частично обновить значение атрибута
      tags:
      - AttributeValue
    put:
      consumes:
      - application/json
      description: Обновляет все поля значения атрибута по ID (PUT)
      parameters:
      - description: AttributeValue ID
        in: path
        name: id
        required: true
        type: integer
      - description: Обновляемые поля значения атрибута
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/response.AttributeValueUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AttributeValueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Полностью обновить значение атрибута
      tags:
      - AttributeValue
  /attributes:
    get:
      description: Возвращает список всех атрибутов с пагинацией
      parameters:
      - default: 1
        description: Номер страницы
        in: query
        name: page
        type: integer
      - default: 20
        description: Лимит на страницу
        in: query
        name: limit
        type: integer
      - description: Поиск по названию или slug
        in: query
        name: search
        type: string
      - description: Фильтр по типу атрибута
        in: query
        name: attribute_type
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AttributeListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Получить список атрибутов
      tags:
      - Attribute
    post:
      consumes:
      - application/json
      description: Создает новый атрибут
      parameters:
      - description: Данные для создания атрибута
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/response.AttributeCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.AttributeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Создать атрибут
      tags:
      - Attribute
  /attributes/{id}:
    delete:
      description: Удаляет атрибут из БД по ID
      parameters:
      - description: Attribute ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Атрибут успешно удален
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Удалить атрибут
      tags:
      - Attribute
    get:
      description: Возвращает атрибут по ID
      parameters:
      - description: Attribute ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
